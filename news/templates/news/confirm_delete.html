{% extends 'base.html' %}
{% block title %}Delete - Daily Dispatch{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="bg-white rounded-4 shadow-sm p-4 p-lg-5">
      <div class="text-eyebrow mb-1 text-danger">Destructive action</div>
      <h1 class="display-hero mb-3">Delete this item?</h1>

      <div class="alert alert-warning" role="alert">
        <div class="fw-semibold mb-1">{{ object }}</div>
        <div class="small">This action cannot be undone.</div>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button class="btn btn-danger btn-pill px-4" type="submit">
            <i class="bi bi-trash me-1" aria-hidden="true"></i> Yes, delete
          </button>
          <a class="btn btn-link" href="javascript:history.back()">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
